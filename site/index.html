<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TropicalWeather | Standard Weather</title>
  <meta name="description" content="TropicalWeather — live tropical cyclone map: NHC advisories and cones, ATCF model guidance, TCPOD aircraft tasking, recon observations and GOES satellite." />
  <meta name="theme-color" content="#070914" />
  <link rel="canonical" href="https://standardweather.github.io/TropicalWeather/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://standardweather.github.io/TropicalWeather/" />
  <meta property="og:title" content="TropicalWeather | Standard Weather" />
  <meta property="og:description" content="Live tropical cyclone map with NHC advisories, model guidance, recon tasking and satellite." />
  <meta property="og:image" content="https://standardweather.github.io/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Shared theme from the main site (standardweather.github.io repo). -->
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    /* TropicalWeather console layout, built on the shared site tokens. */
    :root { --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; --rule: rgba(255, 255, 255, 0.1); --side: #0b0e22; --nav-h: 61px; }
    [hidden] { display: none !important; }
    body { height: 100vh; height: 100dvh; overflow: hidden; }
    .site-nav__inner { width: calc(100% - 2.5rem); }
    .site-footer { display: none; }

    .app { display: grid; grid-template-columns: 23.5rem minmax(0, 1fr); height: calc(100dvh - var(--nav-h)); }
    .side { background: var(--side); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
    .side__head { padding: 1.1rem 1.25rem 0.8rem; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .side__head h1 { margin: 0; font: 600 1.35rem/1 var(--brand); color: #fff; letter-spacing: -0.01em; }
    .side__head h1 span { font-weight: 400; color: rgba(255, 255, 255, 0.7); }
    .side__head time { font: 0.75rem var(--mono); color: var(--text3); text-align: right; }
    .side__head time.stale { color: var(--err); }

    .tabs { display: flex; gap: 1.1rem; padding: 0 1.25rem; border-bottom: 1px solid var(--rule); font-size: 0.84rem; overflow-x: auto; scrollbar-width: none; }
    .tabs button {
      all: unset; cursor: pointer; padding: 0.55rem 0; color: var(--text3); white-space: nowrap;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tabs button:hover { color: var(--text2); }
    .tabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
    .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .scroll { overflow: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
    .sys { border-bottom: 1px solid var(--rule); }
    .sys__row {
      all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 24px 1fr auto; gap: 0.8rem;
      align-items: center; padding: 0.85rem 1.25rem; cursor: pointer;
    }
    .sys__row:hover { background: rgba(255, 255, 255, 0.03); }
    .sys__row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .sys.sel .sys__row { background: rgba(74, 209, 255, 0.06); box-shadow: inset 3px 0 0 var(--accent); }
    .sys__name { font: 600 1.02rem/1.2 var(--brand); color: #fff; }
    .sys__name small { display: block; font: 400 0.76rem var(--font); color: var(--text3); }
    .sys__nums { font: 0.82rem/1.35 var(--mono); color: var(--text2); text-align: right; white-space: nowrap; }
    .sys__nums b { color: #fff; font-weight: 500; }
    .sys.quiet .sys__name { color: var(--text2); }
    .detail { padding: 0 1.25rem 1rem; }
    .detail .tabs { padding: 0; margin-bottom: 0.7rem; }
    .empty { padding: 1rem 1.25rem; font-size: 0.86rem; color: var(--text3); margin: 0; max-width: none; }

    table.fc { width: 100%; border-collapse: collapse; font: 0.8rem var(--mono); }
    table.fc th { text-align: left; font: 500 0.72rem var(--font); color: var(--text3); padding: 0.2rem 0 0.35rem; }
    table.fc td { padding: 0.28rem 0; border-top: 1px solid var(--rule); color: rgba(255, 255, 255, 0.86); }
    table.fc td:last-child, table.fc th:last-child { text-align: right; }
    table.fc td .dim { color: var(--text3); }
    .cat { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; margin-right: 0.45rem; vertical-align: 0; }
    .note { font-size: 0.8rem; color: var(--text2); margin: 0.7rem 0 0; line-height: 1.5; max-width: none; }
    .note b { color: #fff; font-weight: 600; }
    .links { display: flex; flex-wrap: wrap; gap: 0.25rem 0.9rem; margin: 0.7rem 0 0; font-size: 0.8rem; }
    .links a { text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    h5.sub { margin: 0.9rem 0 0.35rem; font: 500 0.74rem var(--font); color: var(--text3); letter-spacing: 0; text-transform: none; }
    .chart-key { font-size: 0.72rem; color: var(--text3); margin: 0.25rem 0 0; max-width: none; }
    dl.kv { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.2rem 0.8rem; margin: 0.3rem 0 0; font-size: 0.8rem; }
    dl.kv dt { color: var(--text3); }
    dl.kv dd { margin: 0; font-family: var(--mono); font-size: 0.78rem; color: rgba(255, 255, 255, 0.88); }
    .flight { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--rule); }
    .flight:first-of-type { border-top: 0; padding-top: 0; }
    .flight > b { font-size: 0.86rem; color: #fff; }
    .live { font: 600 0.62rem var(--font); letter-spacing: 0.06em; color: #0b1a10; background: var(--hail); border-radius: 3px; padding: 0.05rem 0.3rem; margin-left: 0.35rem; vertical-align: 1px; }
    .models { display: grid; grid-template-columns: 1fr 1fr; gap: 0.15rem 0.8rem; margin-top: 0.35rem; font: 0.76rem var(--mono); color: var(--text2); }
    .models i { display: inline-block; width: 0.9rem; height: 0.16rem; border-radius: 2px; vertical-align: middle; margin-right: 0.45rem; }
    pre.raw {
      margin: 0.5rem 0 0; padding: 0.7rem 0.75rem; border-radius: 6px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--rule);
      font: 0.72rem/1.5 var(--mono); color: var(--text2); white-space: pre-wrap; max-height: 22rem; overflow: auto;
    }
    details.more summary { cursor: pointer; color: var(--accent); font-size: 0.8rem; margin-top: 0.7rem; }

    .side__foot { border-top: 1px solid var(--rule); padding: 0.75rem 1.25rem 0.9rem; font-size: 0.8rem; }
    .side__foot h4 { margin: 0 0 0.45rem; font: 500 0.74rem var(--font); color: var(--text3); letter-spacing: 0; text-transform: none; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.8rem; }
    .checks label { display: flex; gap: 0.5rem; align-items: center; margin: 0; font-size: 0.8rem; font-weight: 400; color: rgba(255, 255, 255, 0.85); letter-spacing: 0; text-transform: none; cursor: pointer; }
    .checks input, .models input {
      appearance: auto; -webkit-appearance: auto; width: 0.9rem; height: 0.9rem; min-height: 0; margin: 0; padding: 0;
      accent-color: var(--accent); box-shadow: none; border: 0; background: none; flex: none;
    }
    .models label { display: flex; gap: 0.45rem; align-items: center; margin: 0; font: 0.78rem var(--font); color: rgba(255, 255, 255, 0.85); letter-spacing: 0; text-transform: none; cursor: pointer; }
    .satpick { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; margin-top: 0.6rem; font-size: 0.8rem; color: var(--text3); }
    .satpick button { all: unset; cursor: pointer; color: var(--text2); }
    .satpick button[aria-pressed="true"] { color: #fff; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 0.3em; text-decoration-thickness: 2px; }
    .satpick button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .stage { position: relative; min-width: 0; margin: 0; }
    #map { position: absolute; inset: 0; background: #0b1022; }
    .scrub {
      position: absolute; z-index: 800; left: 1rem; bottom: 1rem; width: min(34rem, calc(100% - 2rem));
      display: flex; align-items: center; gap: 0.7rem; padding: 0.45rem 0.8rem; background: rgba(8, 10, 24, 0.85);
      border: 1px solid var(--rule); border-radius: 8px; font: 0.76rem var(--mono); color: var(--text2);
    }
    .scrub button { all: unset; cursor: pointer; color: #fff; width: 1.2rem; text-align: center; font-size: 0.8rem; }
    .scrub input[type="range"] {
      flex: 1; min-width: 4rem; appearance: auto; -webkit-appearance: auto; width: auto; min-height: 0; padding: 0; border: 0; background: none;
      accent-color: var(--accent); box-shadow: none;
    }
    .scrub b { color: #fff; font-weight: 500; white-space: nowrap; }
    .scrub span { white-space: nowrap; }
    .status { position: absolute; z-index: 800; top: 1rem; left: 50%; transform: translateX(-50%); padding: 0.35rem 0.8rem; border-radius: 6px; background: rgba(8, 10, 24, 0.85); border: 1px solid var(--rule); font-size: 0.78rem; color: var(--text2); }
    .leaflet-control-zoom { margin: 1rem !important; }
    .leaflet-tooltip.tw-label { background: none; border: 0; box-shadow: none; color: #fff; font: 600 13px var(--brand); text-shadow: 0 0 3px #000, 0 0 8px #000; padding: 0; }
    .leaflet-tooltip.tw-label::before { display: none; }
    .leaflet-tooltip.tw-tip { background: rgba(10, 13, 30, 0.92); color: #fff; border: 1px solid var(--rule); border-radius: 5px; box-shadow: none; font: 0.74rem var(--mono); padding: 2px 6px; }
    .leaflet-tooltip.tw-tip::before { display: none; }
    .leaflet-popup-content-wrapper { border-radius: 8px; }
    .leaflet-popup-content { margin: 0.75rem 0.9rem; font-size: 0.82rem; line-height: 1.45; }
    .leaflet-popup-content h4 { margin: 0 0 0.35rem; font: 600 0.95rem var(--brand); letter-spacing: 0; text-transform: none; color: #fff; }
    .leaflet-popup-content table { border-collapse: collapse; }
    .leaflet-popup-content td { padding: 0.05rem 0.7rem 0.05rem 0; font-family: var(--mono); font-size: 0.76rem; }
    .leaflet-popup-content td:first-child { color: var(--text3); font-family: var(--font); white-space: nowrap; }
    .leaflet-popup-close-button { color: var(--text2) !important; }

    @media (max-width: 760px) {
      body { height: auto; overflow: auto; }
      .site-footer { display: block; }
      .app { grid-template-columns: 1fr; height: auto; }
      .stage { order: -1; height: 58vh; min-height: 22rem; }
      .side { border-right: 0; }
      .scroll { overflow: visible; }
      .scrub { left: 0.6rem; bottom: 1.9rem; width: calc(100% - 1.2rem); }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Primary">
    <div class="site-nav__inner">
      <a class="site-nav__brand" href="/">
        <img src="/assets/logo-light.png" width="32" height="32" alt="" />
        Standard Weather
      </a>
      <ul class="site-nav__links">
        <li><a href="/">Home</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/PastWeather/">PastWeather</a></li>
        <li><a href="/FutureWeather/">FutureWeather</a></li>
        <li><a href="/TropicalWeather/" aria-current="page">TropicalWeather</a></li>
      </ul>
    </div>
  </nav>

  <div class="app">
    <aside class="side" aria-label="Tropical systems">
      <div class="side__head"><h1><span>Tropical</span>Weather</h1><time id="updated"></time></div>
      <div class="tabs" role="tablist" aria-label="Basin" id="basins">
        <button role="tab" data-basin="ALL" aria-selected="true">All basins</button>
        <button role="tab" data-basin="AL" aria-selected="false">Atlantic</button>
        <button role="tab" data-basin="EP" aria-selected="false">E. Pacific</button>
        <button role="tab" data-basin="CP" aria-selected="false">C. Pacific</button>
      </div>
      <div class="scroll" id="list"><p class="empty">Loading…</p></div>
      <div class="side__foot">
        <h4>Map layers</h4>
        <div class="checks" id="layers">
          <label><input type="checkbox" data-layer="cone" checked /> Forecast cone</label>
          <label><input type="checkbox" data-layer="ww" checked /> Watches &amp; warnings</label>
          <label><input type="checkbox" data-layer="models" checked /> Model tracks</label>
          <label><input type="checkbox" data-layer="past" checked /> Past track</label>
          <label><input type="checkbox" data-layer="recon" checked /> Recon flights</label>
          <label><input type="checkbox" data-layer="outlook" checked /> 7-day outlook</label>
          <label><input type="checkbox" data-layer="radii" /> Wind field</label>
          <label><input type="checkbox" data-layer="sat" checked /> Satellite</label>
        </div>
        <div class="satpick" id="satpick" role="group" aria-label="Satellite product">
          <button data-sat="ir" aria-pressed="true">Infrared</button>
          <button data-sat="vis" aria-pressed="false">Visible</button>
          <button data-sat="geocolor" aria-pressed="false">GeoColor</button>
          <button data-sat="airmass" aria-pressed="false">Air mass</button>
        </div>
      </div>
    </aside>

    <section class="stage" aria-label="Map">
      <div id="map"></div>
      <div class="status" id="status" hidden></div>
      <div class="scrub" id="scrub">
        <button id="play" aria-label="Play satellite loop">▶</button>
        <span id="t0"></span>
        <input type="range" id="frame" min="0" max="0" value="0" aria-label="Satellite frame" />
        <b id="t1">Satellite loading…</b>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Standard Weather Forensics &amp; Consulting · Not an official forecast — refer to the <a href="https://www.nhc.noaa.gov/">National Hurricane Center</a>.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
